- type: tile
  id: FloorThatch
  name: thatch floor
  sprite: /Textures/Civ14/Structures/Floors/wood.rsi/thatch2.png
  variants: 1
  baseTurf: FloorDirt
  isSubfloor: false
  deconstructTools: [Prying]
  footstepSounds:
    collection: FootstepWood
  barestepSounds:
    collection: BarestepWood
  itemDrop: FloorTileItemThatch
  heatCapacity: 10000
  weather: false

- type: entity
  name: thatch floor
  parent: FloorTileItemBase
  id: FloorTileItemThatch
  components:
    - type: Sprite
      sprite: Civ14/Structures/Floors/wood.rsi
      state: thatch_hand
    - type: Item
      heldPrefix: wood
    - type: FloorTile
      outputs:
        - FloorThatch
    - type: Stack
      stackType: FloorTileThatch

- type: entity
  id: FloorThatchStructure
  parent: FloorWoodClassic
  name: thatch floor
  description: "A floor made of compressed dried straw."
  components:
    - type: Sprite
      sprite: Civ14/Structures/Floors/wood.rsi
      state: thatch2
      drawdepth: FloorTiles
    - type: Destructible
      thresholds:
        - trigger: !type:DamageTrigger
            damage: 25
          behaviors:
            - !type:DoActsBehavior
              acts: ["Destruction"]

- type: entity
  id: FloorWoodClassic
  parent: BaseStructure
  name: wood floor
  description: "A rustic wood floor."
  components:
    - type: Sprite
      sprite: Civ14/Structures/Floors/wood.rsi
      state: wood
      drawdepth: FloorTiles
    - type: IsRoof
    - type: Tag
      tags:
        - ForceFixRotations
    - type: Physics
      canCollide: false
    - type: Fixtures
    - type: Damageable
      damageContainer: Inorganic
    - type: Destructible
      thresholds:
        - trigger: !type:DamageTrigger
            damage: 40
          behaviors:
            - !type:DoActsBehavior
              acts: ["Destruction"]
    - type: BlockWeather
    - type: SunShadowCast

