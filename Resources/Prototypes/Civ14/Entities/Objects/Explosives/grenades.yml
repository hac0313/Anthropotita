- type: entity
  name: Stielhandgranate 24
  description: Немецкая осколочная граната времен Второй мировой войны.
  parent: GrenadeBase
  id: GrenadeSHG24
  components:
    - type: Explosive
      explosionType: CivGrenade
      maxIntensity: 5
      intensitySlope: 2
      totalIntensity: 30 # about a ~4 tile radius
      canCreateVacuum: false
    - type: TriggerOnUse
    - type: ProjectileGrenade
      TriggerKey: trigger
      fillPrototype: PelletClusterLethal
      capacity: 15
    - type: ContainerContainer
      containers:
        cluster-payload: !type:Container
    - type: TimerTrigger
      delay: 5
    - type: ExplodeOnTrigger
      keysIn:
      - timer
    - type: Sprite
      sprite: Civ14/Objects/grenade.rsi
      layers:
        - state: stgnade
          map: ["enum.TriggerVisualLayers.Base"]
    - type: GenericVisualizer
      visuals:
        enum.Trigger.TriggerVisuals.VisualState:
          enum.ConstructionVisuals.Layer:
            Primed: { state: stgnade_active }
            Unprimed: { state: stgnade }
    - type: Destructible
      thresholds:
        - trigger: !type:DamageTrigger
            damage: 60
          behaviors:
            - !type:TriggerBehavior
            - !type:DoActsBehavior
              acts: ["Destruction"]

