# smoke

- type: entity
  parent: GrenadeBase
  id: SmokeGrenadeRDG2
  name: RDG-2 smoke grenade
  description: Тактическая граната, которая при использовании выпускает большое и продолжительное облако дыма.
  components:
    - type: Sprite
      sprite: Civ14/Objects/Grenades/rdg2.rsi
      state: rdg2_yellow
    - type: TriggerOnUse
    - type: TimerTrigger
      delay: 3
    - type: SmokeOnTrigger
      keysIn:
      - timer
      duration: 25
      spreadAmount: 30
    - type: EmitSoundOnTrigger
      keysIn:
      - timer
      positional: true
      sound: /Audio/Items/smoke_grenade_smoke.ogg
    - type: DeleteOnTrigger
      keysIn:
      - timer

