# Base body part prototypes referenced by _Shitmed surgery/body parts.

# Abstract base for inorganic body parts
- type: entity
  id: BasePartInorganic
  abstract: true
  parent: BaseItem
  components:
  - type: BodyPart
  - type: Damageable
    damageContainer: OrganicPart
  - type: Destructible
    thresholds: []

# Abstract base for inorganic torsos
- type: entity
  id: BaseTorsoInorganic
  abstract: true
  parent: BasePartInorganic
  components:
  - type: BodyPart
    children:
      head:
        id: "head"
        type: Head
      left arm:
        id: "left arm"
        type: Arm
      right arm:
        id: "right arm"
        type: Arm
      left leg:
        id: "left leg"
        type: Leg
      right leg:
        id: "right leg"
        type: Leg

# Abstract base head
- type: entity
  id: BaseHead
  abstract: true
  parent: BasePartInorganic
  components:
  - type: BodyPart

# Abstract base for animal parts
- type: entity
  id: PartAnimalBase
  abstract: true
  parent: BasePartInorganic
  components:
  - type: BodyPart
