        type: Foot

- type: entity
  id: LeftFootHuman
  abstract: true
  parent: PartHuman
  components:
  - type: BodyPart

- type: entity
  id: RightFootHuman
  abstract: true
  parent: PartHuman
  components:
  - type: BodyPart

- type: entity
  id: LeftArmHuman
  abstract: true
  parent: PartHuman
  components:
  - type: BodyPart
    children:
      left hand:
        id: "left hand"
        type: Hand

- type: entity
  id: RightArmHuman
  abstract: true
  parent: PartHuman
  components:
